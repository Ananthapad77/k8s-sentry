# =====================================================================
# K8s-Sentry agent — Deployment + Service.
#
# Runs the FastAPI webhook receiver in-cluster using the read-only
# ServiceAccount. Secrets (Anthropic key, Slack webhook) are pulled from
# a Kubernetes Secret named `k8s-sentry-secrets` (see 21-secret.example.yaml).
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-sentry
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: k8s-sentry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-sentry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-sentry
    spec:
      serviceAccountName: k8s-sentry
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Replace with your pushed image, e.g. <ACCOUNT>.dkr.ecr.<REGION>.amazonaws.com/k8s-sentry:0.1.0
          image: k8s-sentry:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: k8s-sentry-secrets
          env:
            - name: TARGET_NAMESPACE
              value: "devops-lab"
            - name: AGENT_MODE
              value: "read_only"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-sentry
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: k8s-sentry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: k8s-sentry
  ports:
    - name: http
      port: 80
      targetPort: http
